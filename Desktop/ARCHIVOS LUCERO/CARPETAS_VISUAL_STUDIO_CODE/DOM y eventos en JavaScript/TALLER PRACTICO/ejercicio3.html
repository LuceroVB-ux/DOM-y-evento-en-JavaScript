<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de escritura</title>
</head>
<body>
    <h1>Seguimiento de escritura</h1>
    <label for="texto">Escribe algo: </label>
    <input type="text" id="texto" placeholder="Escribe aqui...">
    <p id="resultado">Aqui, aparecera lo que escribas...</p>

    <script>
        let campo = document.getElementById("texto");
        let parrafo = document.getElementById("resultado");

        campo.addEventListener("input", function(){
            parrafo.textContent = campo.value;
        });
    </script>
</body>
</html>
