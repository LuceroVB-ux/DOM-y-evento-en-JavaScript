<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cambio de apariencia</h1>
    <section id="seccion" style="background-color: lightblue; padding: 10px;">
        <h2>Mi sección</h2>
        <p>Cambiará de color la sección cuando presión el botón.</p>
    </section>
    <br>
    <button id="cambiar">Cambiar color</button>
    <button id="restaurar">Restaurar color</button>
    <script>
        let seccion = document.getElementById("seccion");
        let botonCambiar = document.getElementById("cambiar");
        let botonRestaurar = document.getElementById("restaurar");

        botonCambiar.addEventListener("Click", function(){
            seccion.style.backgroundColor = "lightgreen";
        });
        botonRestaurar.addEventListener("Click", function(){
            seccion.style.backgroundColor = "lightblue";
        });
    </script>
</body>
</html>
