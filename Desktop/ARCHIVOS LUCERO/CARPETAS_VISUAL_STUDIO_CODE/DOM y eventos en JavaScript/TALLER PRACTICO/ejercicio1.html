<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Boton interactivo</h1>
    <p id="mensaje">Hola mundo...¿Como estas?...espero que bien.</p>
    <button id="boton">Cambiar texto</button>
    <script>
        let parrafo = document.getElementById("mensaje");
        let boton = document.getElementById("boton");
        boton.addEventListener("click", function(){
            parrafo.textContent = "El texto ha sido cambiado correctamente"
        });
    </script>
</body>
</html>
