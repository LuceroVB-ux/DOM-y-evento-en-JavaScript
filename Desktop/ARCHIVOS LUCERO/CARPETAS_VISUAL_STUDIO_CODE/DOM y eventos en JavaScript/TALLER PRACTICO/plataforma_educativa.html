
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma educativa</title>
</head>
<body>

    <h1>Mi plataforma educativa</h1>

    <button id="boton">Consultar cursos</button>

    <br><br>

    <input type="text" id="busqueda" placeholder="Buscar un curso">

    <ul id="lista"></ul>

    <script>
        const boton = document.getElementById("boton");
        const busqueda = document.getElementById("busqueda");
        const lista = document.getElementById("lista");

        let cursos = ["JavaScript", "Bases de datos", "HTML y CSS"];

        boton.addEventListener("click", function() {
            lista.innerHTML = "";

            for (let curso of cursos) {
                let elemento = document.createElement("li");
                elemento.textContent = curso;
                lista.appendChild(elemento);
            }
        });

        busqueda.addEventListener("input", function() {
            lista.innerHTML = "";

            for (let curso of cursos) {
                if (curso.toLowerCase().includes(busqueda.value.toLowerCase())) {
                    let elemento = document.createElement("li");
                    elemento.textContent = curso;
                    lista.appendChild(elemento);
                }
            }
        });
    </script>

</body>
</html>
